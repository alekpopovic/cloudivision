apiVersion: cicd.cloudivision.io/v1alpha1
kind: PipelineTemplate
metadata: {name: example-node-api, namespace: cloudivision}
spec:
  projectRef: demo-project
  description: Test and package the Node.js API
  steps:
    - {name: test, image: node:24-alpine, workingDir: examples/node-api, command: [npm], args: [test], timeoutSeconds: 120}
  build: {enabled: true, contextDir: examples/node-api, dockerfile: Dockerfile, builder: buildkit, image: localhost:5001/examples/node-api, push: false}
  resources: {cpuRequest: 100m, cpuLimit: "1", memoryRequest: 128Mi, memoryLimit: 1Gi, timeoutSeconds: 600}
  security: {allowPrivileged: false, runAsNonRoot: true, readOnlyRootFilesystem: false}
---
apiVersion: cicd.cloudivision.io/v1alpha1
kind: Repository
metadata: {name: example-node-api, namespace: cloudivision}
spec: {projectRef: demo-project, provider: generic, url: https://github.com/alekpopovic/cloudivision.git, defaultBranch: main, pipelineTemplateRef: example-node-api, webhook: {enabled: false, events: [push]}}
---
apiVersion: cicd.cloudivision.io/v1alpha1
kind: BuildRun
metadata: {name: example-node-api-manual, namespace: cloudivision}
spec:
  projectRef: demo-project
  repositoryRef: example-node-api
  pipelineTemplateRef: example-node-api
  revision: main
  branch: main
  triggeredBy: {type: manual, actor: evaluator}
  image: {repository: localhost:5001/examples/node-api, tag: dev}
  executor: job
  gitOps: {enabled: false}

# Versioned examples matching GET /api/v1/catalog/pipeline-templates.
apiVersion: cicd.cloudivision.io/v1alpha1
kind: PipelineTemplate
metadata: {name: go, annotations: {cicd.cloudivision.io/catalog-version: 1.0.0}}
spec: {steps: [{name: test, image: "golang:1.26", command: [go, test, ./...]}], build: {enabled: true, builder: buildkit, contextDir: ., dockerfile: Dockerfile, push: true}, security: {runAsNonRoot: true}}
---
apiVersion: cicd.cloudivision.io/v1alpha1
kind: PipelineTemplate
metadata: {name: node-npm, annotations: {cicd.cloudivision.io/catalog-version: 1.0.0}}
spec: {steps: [{name: test, image: "node:24-alpine", command: [sh, -c, "npm ci && npm test"]}], build: {enabled: true, builder: buildkit, push: true}, security: {runAsNonRoot: true}}
---
apiVersion: cicd.cloudivision.io/v1alpha1
kind: PipelineTemplate
metadata: {name: node-pnpm, annotations: {cicd.cloudivision.io/catalog-version: 1.0.0}}
spec: {steps: [{name: test, image: "node:24-alpine", command: [sh, -c, "corepack enable && pnpm install --frozen-lockfile && pnpm test"]}], build: {enabled: true, builder: buildkit, push: true}, security: {runAsNonRoot: true}}
---
apiVersion: cicd.cloudivision.io/v1alpha1
kind: PipelineTemplate
metadata: {name: angular, annotations: {cicd.cloudivision.io/catalog-version: 1.0.0}}
spec: {steps: [{name: test, image: "node:24-alpine", command: [sh, -c, "npm ci && npm test -- --watch=false && npm run build"]}], build: {enabled: true, builder: buildkit, push: true}, security: {runAsNonRoot: true}}

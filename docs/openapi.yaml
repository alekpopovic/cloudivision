openapi: 3.0.3
info:
  title: cloudivision API
  version: 0.2.0
  description: Thin HTTP API over cloudivision Kubernetes CRDs. Bearer authentication is required outside explicitly documented development auth-disabled mode; provider webhooks use signatures instead.
paths:
  /healthz:
    get:
      responses:
        "200":
          description: API process is healthy.
  /readyz:
    get:
      responses:
        "200":
          description: API process is ready.
  /metrics:
    get:
      responses:
        "200":
          description: Prometheus metrics when API metrics are enabled.
  /api/v1/auth/me:
    get:
      responses:
        "200":
          description: Return the authenticated principal and resolved roles.
  /api/v1/organizations:
    get:
      responses:
        "200": {description: Organizations available to the current principal.}
  /api/v1/organizations/{organization}/teams:
    get:
      parameters:
        - {name: organization, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Teams in the organization.}
        "403": {description: Organization membership does not grant read access.}
  /api/v1/organizations/{organization}/members:
    get:
      parameters:
        - {name: organization, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Organization memberships.}
  /api/v1/organizations/{organization}/project-access:
    get:
      parameters:
        - {name: organization, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Team-to-project permission grants.}
  /api/v1/projects:
    get:
      responses:
        "200":
          description: List Project resources.
    post:
      responses:
        "201":
          description: Create a Project resource.
  /api/v1/projects/{name}:
    get:
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Get a Project resource.
  /api/v1/projects/{name}/cache/purge:
    post:
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: namespace, in: query, required: false, schema: {type: string}}
        - {name: repository, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Purge all dependency caches for a project, or only the selected repository.
        "503":
          description: A purge-capable PVC cache backend is not configured on the API server.
  /api/v1/repositories:
    get:
      responses:
        "200":
          description: List Repository resources.
    post:
      responses:
        "201":
          description: Create a Repository resource.
  /api/v1/pipeline-templates:
    get:
      responses:
        "200":
          description: List PipelineTemplate resources.
    post:
      responses:
        "201":
          description: Create a PipelineTemplate resource.
  /api/v1/catalog/pipeline-templates:
    get:
      responses:
        "200": {description: List built-in pipeline template catalog entries.}
  /api/v1/catalog/pipeline-templates/{name}/install:
    post:
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "201": {description: Install a catalog PipelineTemplate in a namespace.}
  /api/v1/pipeline-templates/{namespace}/{name}:
    put:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Update a PipelineTemplate after backend validation.}
        "400": {description: Invalid or duplicate steps.}
  /api/v1/build-runs:
    get:
      parameters:
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/NamespaceFilter"}
        - {$ref: "#/components/parameters/ProjectFilter"}
        - {$ref: "#/components/parameters/RepositoryFilter"}
        - {$ref: "#/components/parameters/PhaseFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {$ref: "#/components/parameters/SortFilter"}
        - {$ref: "#/components/parameters/OrderFilter"}
      responses:
        "200":
          description: List BuildRun resources and status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginatedResponse"}
    post:
      responses:
        "201":
          description: Create a BuildRun resource.
  /api/v1/build-runs/{namespace}/{name}:
    get:
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Get a BuildRun resource and status.
  /api/v1/build-runs/{namespace}/{name}/logs:
    get:
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: tailLines
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Return runner pod logs for a BuildRun.
  /api/v1/build-runs/{namespace}/{name}/artifacts:
    get:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: List artifact metadata from BuildRun status.
  /api/v1/build-runs/{namespace}/{name}/artifacts/{artifactName}:
    get:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: artifactName, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Download artifact content from the configured backend.
        "404":
          description: Artifact metadata or content was not found.
  /api/v1/build-runs/{namespace}/{name}/cancel:
    post:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Cancel an active BuildRun; repeated cancellation is idempotent.
        "409":
          description: BuildRun is terminal and cannot be cancelled.
  /api/v1/build-runs/{namespace}/{name}/retry:
    post:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "201":
          description: Create a related BuildRun from a Failed or Cancelled BuildRun.
        "409":
          description: Source BuildRun is not Failed or Cancelled.
  /api/v1/build-runs/{namespace}/{name}/rerun:
    post:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "201":
          description: Create a related BuildRun from a terminal BuildRun.
        "409":
          description: Source BuildRun is not terminal.
  /api/v1/environments:
    get:
      responses:
        "200":
          description: List Environment resources.
  /api/v1/cluster-targets:
    get:
      responses:
        "200": {description: List the implicit local cluster and experimental ClusterTargets.}
  /api/v1/releases:
    get:
      parameters:
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/NamespaceFilter"}
        - {$ref: "#/components/parameters/ProjectFilter"}
        - {$ref: "#/components/parameters/RepositoryFilter"}
        - {$ref: "#/components/parameters/PhaseFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {$ref: "#/components/parameters/SortFilter"}
        - {$ref: "#/components/parameters/OrderFilter"}
      responses:
        "200":
          description: List Release resources.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginatedResponse"}
  /api/v1/releases/{namespace}/{name}/approve:
    post:
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseApprovalRequest"
      responses:
        "200":
          description: Approve a Release that requires approval.
        "409":
          description: Release is already rejected, failed, deploying or deployed.
  /api/v1/releases/{namespace}/{name}/reject:
    post:
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseApprovalRequest"
      responses:
        "200":
          description: Reject a Release that requires approval.
        "409":
          description: Release is already rejected, failed, deploying or deployed.
  /api/v1/releases/{namespace}/{name}/promote:
    post:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleasePromoteRequest"}
      responses:
        "201": {description: A new Release targeting the requested Environment.}
        "409": {description: Source is not deployed or policy prevents promotion.}
  /api/v1/releases/{namespace}/{name}/rollback:
    post:
      parameters:
        - {name: namespace, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseRollbackRequest"}
      responses:
        "201": {description: A new Release restoring a previous successful image.}
        "409": {description: Rollback target or image violates policy.}
  /api/v1/audit/events:
    get:
      parameters:
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/RepositoryFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {$ref: "#/components/parameters/SortFilter"}
        - {$ref: "#/components/parameters/OrderFilter"}
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: buildRun
          in: query
          required: false
          schema:
            type: string
        - name: release
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List a page of audit events from the configured audit event store.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaginatedResponse"}
  /api/v1/audit/events/export:
    get:
      description: Export permission-protected, recursively redacted audit events.
      parameters:
        - {$ref: "#/components/parameters/ProjectFilter"}
        - {$ref: "#/components/parameters/RepositoryFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {name: organization, in: query, schema: {type: string}}
        - {name: buildRun, in: query, schema: {type: string}}
        - {name: release, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: eventType, in: query, schema: {type: string}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        "200": {description: JSON array or CSV attachment.}
        "403": {description: Principal lacks audit export permission.}
  /api/v1/reports/builds:
    get:
      parameters:
        - {$ref: "#/components/parameters/ProjectFilter"}
        - {$ref: "#/components/parameters/RepositoryFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        "200": {description: Build outcome and duration report.}
  /api/v1/reports/releases:
    get:
      parameters:
        - {$ref: "#/components/parameters/ProjectFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        "200": {description: Release, approval, rollback and deployment failure report.}
  /api/v1/reports/security:
    get:
      parameters:
        - {$ref: "#/components/parameters/ProjectFilter"}
        - {$ref: "#/components/parameters/FromFilter"}
        - {$ref: "#/components/parameters/ToFilter"}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        "200": {description: Policy denial and security rejection report.}
  /api/v1/providers:
    get:
      responses:
        "200":
          description: List registered provider types, names, and capabilities.
  /api/v1/providers/health:
    get:
      responses:
        "200":
          description: Run provider health checks and return messages and timestamps.
  /api/v1/plugins:
    get:
      responses:
        "200":
          description: List statically registered plugins and their metadata.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PluginMetadata"}}
  /api/v1/plugins/health:
    get:
      responses:
        "200":
          description: Run health checks for every registered plugin.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PluginHealthResult"}}
  /api/v1/plugins/{type}/{name}:
    get:
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [git, registry, build, gitops, notification, policy, supply-chain]}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Plugin metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginMetadata"}
        "404": {description: Plugin not found.}
  /api/v1/webhooks/github/{repositoryName}:
    post:
      parameters:
        - name: repositoryName
          in: path
          required: true
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
            enum: [push, pull_request, ping]
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accept a ping, ignore a filtered event, or acknowledge a duplicate delivery without creating a BuildRun.
        "201":
          description: Create a BuildRun from a verified GitHub push or pull-request event.
        "400":
          description: Reject malformed payloads or missing event metadata.
        "401":
          description: Reject a missing or invalid signature or an event outside the replay window.
        "413":
          description: Reject a payload larger than 1 MiB.
  /api/v1/webhooks/gitlab/{repositoryName}:
    post:
      parameters:
        - name: repositoryName
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Create a BuildRun from a verified GitLab push event.
  /api/v1/webhooks/gitea/{repositoryName}:
    post:
      parameters:
        - name: repositoryName
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Create a BuildRun from a verified Gitea push event. Supports X-Gitea-Signature HMAC SHA256 and X-Gitea-Token token mode.
  /api/v1/webhooks/generic/{repositoryName}:
    post:
      parameters:
        - name: repositoryName
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Create a BuildRun from a verified generic push event.
components:
  parameters:
    ListLimit:
      name: limit
      in: query
      schema: {type: integer, default: 50, minimum: 1, maximum: 200}
    PageToken:
      name: pageToken
      in: query
      description: Opaque continuation token from nextPageToken. The continue alias is also accepted.
      schema: {type: string}
    NamespaceFilter:
      name: namespace
      in: query
      schema: {type: string}
    ProjectFilter:
      name: project
      in: query
      schema: {type: string}
    RepositoryFilter:
      name: repository
      in: query
      schema: {type: string}
    PhaseFilter:
      name: phase
      in: query
      schema: {type: string}
    FromFilter:
      name: from
      in: query
      schema: {type: string, format: date-time}
    ToFilter:
      name: to
      in: query
      schema: {type: string, format: date-time}
    SortFilter:
      name: sort
      in: query
      schema: {type: string, default: createdAt}
    OrderFilter:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: desc}
  schemas:
    PaginatedResponse:
      type: object
      required: [items, totalCount, limit]
      properties:
        items: {type: array, items: {type: object}}
        nextPageToken: {type: string}
        totalCount: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          description: Request ID for correlating API errors with server logs.
        violations:
          type: array
          items:
            type: object
            required: [policy, severity, message]
            properties:
              policy: {type: string}
              severity: {type: string}
              message: {type: string}
              fieldPath: {type: string}
    PluginCapability:
      type: object
      required: [name, description]
      properties:
        name: {type: string}
        description: {type: string}
    PluginMetadata:
      type: object
      required: [name, type, version, capabilities, configSchema, configured, configurationStatus]
      properties:
        name: {type: string}
        type: {type: string, enum: [git, registry, build, gitops, notification, policy, supply-chain]}
        version: {type: string}
        capabilities: {type: array, items: {$ref: "#/components/schemas/PluginCapability"}}
        configSchema: {type: object, additionalProperties: true}
        configured: {type: boolean}
        configurationStatus: {type: string}
        docsUrl: {type: string}
    PluginHealthResult:
      type: object
      required: [metadata, health]
      properties:
        metadata: {$ref: "#/components/schemas/PluginMetadata"}
        health:
          type: object
          required: [healthy, message, checkedAt]
          properties:
            healthy: {type: boolean}
            message: {type: string}
            checkedAt: {type: string, format: date-time}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ReleaseApprovalRequest:
      type: object
      required:
        - actor
      properties:
        actor:
          type: string
        comment:
          type: string
    ReleasePromoteRequest:
      type: object
      required: [targetEnvironmentRef]
      properties:
        targetEnvironmentRef: {type: string}
        actor: {type: string}
    ReleaseRollbackRequest:
      type: object
      required: [targetReleaseRef]
      properties:
        targetReleaseRef: {type: string}
        actor: {type: string}
        reason: {type: string}

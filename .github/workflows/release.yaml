name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cloudivision

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Validate tag and versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '[:space:]' < VERSION)"
          test "$version" = "$(awk '$1 == "version:" {print $2}' charts/cloudivision/Chart.yaml)"
          test "$version" = "$(awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2}' charts/cloudivision/Chart.yaml)"
          echo "value=$version" >>"$GITHUB_OUTPUT"

  checks:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v4
      - name: Go formatting, tests and vet
        run: |
          test -z "$(gofmt -l api cmd internal)"
          go test ./...
          go vet ./...
      - name: Web dependencies, build and tests
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: web
      - name: Chart and security checks
        run: |
          helm template cloudivision charts/cloudivision --include-crds >/tmp/cloudivision.yaml
          make security-check
          make upgrade-test
          make scale-test
      - name: Conformance requirement
        run: echo "Live conformance must be attached to the protected release approval; it is not run against an implicit shared context."

  images:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [controller, api, runner, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.version, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  artifacts:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v4
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Package local artifacts
        env:
          RELEASE_SKIP_CHECKS: "true"
          RELEASE_GENERATE_SBOM: "false"
        run: ./scripts/release/build-local.sh "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudivision-${{ needs.validate.outputs.version }}
          path: dist/release/v${{ needs.validate.outputs.version }}/*
          if-no-files-found: error

  publish:
    needs: [validate, images, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cloudivision-${{ needs.validate.outputs.version }}
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}

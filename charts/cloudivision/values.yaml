global:
  imageRegistry: ghcr.io/alekpopovic/cloudivision

namespace:
  create: false
  podSecurity:
    enabled: true
    level: restricted

controller:
  replicaCount: 1
  concurrency:
    project: 2
    buildRun: 10
    release: 5
  image:
    repository: controller
    tag: dev
    pullPolicy: IfNotPresent
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  leaderElection: false
  startupProbe:
    enabled: true
    failureThreshold: 30
    periodSeconds: 2
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

admissionWebhooks:
  # Optional because a TLS certificate lifecycle is required.
  enabled: false
  port: 9443
  failurePolicy: Fail
  timeoutSeconds: 10
  certManager:
    enabled: false
  existingSecret: ""
  # Required with existingSecret; PEM-encoded CA bundle, base64 encoded.
  caBundle: ""

api:
  replicaCount: 1
  image:
    repository: api
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  auth:
    mode: disabled
    oidc:
      issuerUrl: ""
      clientId: ""
      audience: ""
      jwksUrl: ""
    groupMappings: []
  metrics:
    enabled: true
  startupProbe:
    enabled: true
    failureThreshold: 30
    periodSeconds: 2
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  defaultNamespace: default
  cors:
    allowedOrigins:
      - http://localhost:4200
      - http://localhost:4201
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

runner:
  image:
    repository: runner
    tag: dev
    pullPolicy: IfNotPresent

web:
  replicaCount: 1
  image:
    repository: web
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  config:
    apiBaseUrl: ""
  startupProbe:
    enabled: true
    failureThreshold: 30
    periodSeconds: 2
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

database:
  enabled: false
  externalUrlSecret:
    name: ""
    key: database-url

audit:
  backend: log

logs:
  backend: kubernetes-pod-logs
  local:
    root: /var/lib/cloudivision/logs
    existingClaim: ""

artifacts:
  backend: disabled
  local:
    root: /var/lib/cloudivision/artifacts
    existingClaim: ""

cache:
  # PipelineTemplate.spec.cache is still opt-in; this only makes a shared PVC backend available.
  local:
    root: /var/lib/cloudivision/cache
    existingClaim: ""
    maxSize: 2Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cloudivision.local
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls: []

networkPolicy:
  enabled: false
  # Appended verbatim to the baseline same-namespace ingress/egress rules.
  additionalIngress: []
  additionalEgress: []

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

tekton:
  enabled: false

argocd:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
extraEnv: []

# SECURITY WARNING: values below are rendered verbatim into every platform Pod.
# Review them for hostPath, socket, device, Secret, writable-path, and privilege
# exposure. They are intentionally empty and must never carry unsafe defaults.
extraVolumes: []
extraVolumeMounts: []

nameOverride: ""
fullnameOverride: ""

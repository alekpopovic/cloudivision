apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudivision.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudivision.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudivision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cloudivision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "cloudivision.fullname" . }}-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "cloudivision.podScheduling" . | nindent 6 }}
      containers:
        - name: controller
          image: {{ include "cloudivision.image" (list . .Values.controller.image) }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "cloudivision.fullname" . }}-config
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          {{- if .Values.controller.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: {{ .Values.controller.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.controller.startupProbe.periodSeconds }}
          {{- end }}
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: runtime-tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudivision.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudivision.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudivision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cloudivision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "cloudivision.fullname" . }}-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "cloudivision.podScheduling" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "cloudivision.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "cloudivision.fullname" . }}-config
          {{- if or (eq .Values.audit.backend "postgres") .Values.database.externalUrlSecret.name .Values.extraEnv }}
          env:
            {{- if or (eq .Values.audit.backend "postgres") .Values.database.externalUrlSecret.name }}
            - name: CLOU_DIVISION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-database" (include "cloudivision.fullname" .)) .Values.database.externalUrlSecret.name }}
                  key: {{ .Values.database.externalUrlSecret.key | default "database-url" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: auth-config
              mountPath: /etc/cloudivision/auth/groups.yaml
              subPath: groups.yaml
              readOnly: true
            {{- if and (eq .Values.logs.backend "local") .Values.logs.local.existingClaim }}
            - name: stored-logs
              mountPath: {{ .Values.logs.local.root }}
            {{- end }}
            {{- if and (eq .Values.artifacts.backend "local") .Values.artifacts.local.existingClaim }}
            - name: stored-artifacts
              mountPath: {{ .Values.artifacts.local.root }}
            {{- end }}
            {{- if .Values.cache.local.existingClaim }}
            - name: dependency-cache
              mountPath: {{ .Values.cache.local.root }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: runtime-tmp
          emptyDir: {}
        - name: auth-config
          configMap:
            name: {{ include "cloudivision.fullname" . }}-config
            items:
              - key: groups.yaml
                path: groups.yaml
        {{- if and (eq .Values.logs.backend "local") .Values.logs.local.existingClaim }}
        - name: stored-logs
          persistentVolumeClaim:
            claimName: {{ .Values.logs.local.existingClaim }}
        {{- end }}
        {{- if and (eq .Values.artifacts.backend "local") .Values.artifacts.local.existingClaim }}
        - name: stored-artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.artifacts.local.existingClaim }}
        {{- end }}
        {{- if .Values.cache.local.existingClaim }}
        - name: dependency-cache
          persistentVolumeClaim:
            claimName: {{ .Values.cache.local.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudivision.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudivision.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudivision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cloudivision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "cloudivision.fullname" . }}-web
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "cloudivision.podScheduling" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "cloudivision.image" (list . .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: web-config
              mountPath: /usr/share/nginx/html/assets/config.json
              subPath: web-config.json
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- if .Values.web.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: {{ .Values.web.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.web.startupProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: runtime-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: web-config
          configMap:
            name: {{ include "cloudivision.fullname" . }}-config
            items:
              - key: web-config.json
                path: web-config.json
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

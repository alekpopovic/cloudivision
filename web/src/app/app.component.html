<div class="min-h-screen bg-slate-50 text-slate-950">
  <aside class="fixed inset-y-0 left-0 hidden w-72 overflow-y-auto border-r border-brand-800 bg-brand-950 px-5 py-6 text-white shadow-2xl shadow-brand-950/20 lg:block">
    <a routerLink="/dashboard" class="flex items-center gap-3 rounded-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-teal">
      <img src="/assets/brand/cloudivision-mark.png" alt="cloudivision logo" class="h-11 w-11 object-contain">
      <span>
        <span class="block text-xl font-bold tracking-tight">cloudivision</span>
        <span class="block text-[10px] font-semibold uppercase tracking-[0.22em] text-brand-teal">control plane</span>
      </span>
    </a>
    <nav class="mt-9 space-y-1" aria-label="Primary navigation">
      <a
        *ngFor="let item of nav"
        [routerLink]="item.path"
        routerLinkActive="bg-white/10 text-white shadow-sm ring-1 ring-white/10"
        class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-brand-100 transition hover:bg-white/[0.07] hover:text-white"
      >
        <img [src]="'/assets/brand/icons/' + item.icon + '.svg'" alt="" class="h-7 w-7 rounded-lg opacity-80 transition group-hover:opacity-100">
        {{ item.label }}
      </a>
    </nav>
    <div class="mt-10 rounded-2xl border border-brand-800 bg-brand-900/70 p-4">
      <div class="flex items-center gap-2 text-xs font-semibold text-white">
        <span class="h-2 w-2 rounded-full bg-brand-teal shadow-[0_0_12px_#2DD4BF]"></span>
        Kubernetes-native
      </div>
      <p class="mt-2 text-xs leading-5 text-brand-200">CI creates artifacts. GitOps owns deployment.</p>
    </div>
  </aside>

  <div class="lg:pl-72">
    <header class="sticky top-0 z-10 border-b border-slate-200/80 bg-white/90 px-4 py-3 shadow-sm shadow-slate-950/[0.02] backdrop-blur-xl">
      <div class="flex items-center justify-between">
        <a routerLink="/dashboard" class="flex items-center gap-2 font-bold tracking-tight lg:hidden">
          <img src="/assets/brand/cloudivision-mark.png" alt="" class="h-8 w-8 object-contain">
          cloudivision
        </a>
        <nav class="hidden max-w-[70vw] gap-1 overflow-x-auto md:flex lg:hidden" aria-label="Tablet navigation">
          <a *ngFor="let item of nav" [routerLink]="item.path" routerLinkActive="bg-brand-50 text-brand-700" class="whitespace-nowrap rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-600">{{ item.label }}</a>
        </nav>
        <div class="flex items-center gap-3 text-xs text-slate-600" *ngIf="currentUser$ | async as currentUser; else anonymous">
          <span class="font-medium">{{ currentUser.displayName || currentUser.email || currentUser.subject }}</span>
          <span class="rounded-full bg-amber-100 px-2.5 py-1 font-semibold text-amber-800 ring-1 ring-amber-200" *ngIf="currentUser.devMode">development auth</span>
        </div>
        <ng-template #anonymous>
          <span class="rounded-full border border-brand-100 bg-brand-50 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.16em] text-brand-700">Kubernetes-native CI/CD</span>
        </ng-template>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-7 sm:px-6 lg:px-9">
      <router-outlet />
    </main>
  </div>
</div>
